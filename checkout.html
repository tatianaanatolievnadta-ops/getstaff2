<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа — GETSTUFF</title>
  <link rel="icon" type="image/png" href="assets/brand/logo-mark.png">
  <link rel="apple-touch-icon" href="assets/brand/logo-mark.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260918dd">
</head>
<body>
  <div class="page-header">
    <h1 class="page-header__title">Оформление заказа</h1>
    <div class="page-header__breadcrumb">
      <a href="index.html">Главная</a> / <a href="cart.html">Корзина</a> / <span>Оформление</span>
    </div>
  </div>

  <div class="checkout-page checkout-layout">
    <form id="checkout-form" onsubmit="submitCheckout(event)">
      <div class="checkout-card" id="buy-options-checkout"></div>

      <div class="checkout-card">
        <div class="checkout-card__title">Доставка с сайта</div>
        <p class="delivery-info__text" style="margin-bottom:16px">
          Заказ с сайта — со скидкой <strong>−15%</strong> к цене WB.
          Отправка <strong>1 раз в неделю</strong>. Способ доставки менеджер согласует с вами лично.
          Ориентир по стоимости Ozon считается автоматически по городу.
        </p>
        <div class="form-group">
          <label for="city">Город *</label>
          <input type="text" id="city" name="city" required placeholder="Гатчина, Краснодар, Москва…" oninput="updateSummaryByCity('city', 'checkout-summary')">
        </div>
        <div class="form-group">
          <label for="address">Адрес / пункт выдачи (желаемый) *</label>
          <textarea id="address" name="address" required placeholder="Улица, дом или адрес пункта выдачи — уточним с менеджером"></textarea>
        </div>
      </div>

      <div class="checkout-card">
        <div class="checkout-card__title">Заявка менеджеру</div>
        <div class="form-group">
          <label for="name">Имя *</label>
          <input type="text" id="name" name="name" required placeholder="Как к вам обращаться">
        </div>
        <div class="form-group">
          <label for="email">Почта *</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="phone">Телефон *</label>
          <input type="tel" id="phone" name="phone" required placeholder="+7 (___) ___-__-__">
        </div>
        <label class="form-consent">
          <input type="checkbox" name="pd_consent" required>
          <span>Соглашаюсь на <a href="docs.html#consent" target="_blank" rel="noopener">обработку персональных данных</a> и принимаю <a href="docs.html#offer" target="_blank" rel="noopener">оферту</a></span>
        </label>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Отправить заявку</button>
    </form>

    <aside>
      <div class="checkout-card">
        <div class="checkout-card__title">Что в корзине</div>
        <div id="checkout-summary"></div>
      </div>
    </aside>
  </div>

  <script src="js/products.data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/wholesale.js"></script>
  <script src="js/delivery.js"></script>
  <script src="js/prices.js"></script>
  <script src="js/app.js"></script>
  <script src="js/components.js"></script>
  <script>
    renderLayout();
    initCheckoutPage();
    const buyCheckout = document.getElementById('buy-options-checkout');
    if (buyCheckout) buyCheckout.innerHTML = renderBuyOptions({ compact: true });
  </script>
</body>
</html>
